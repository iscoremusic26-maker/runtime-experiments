name: DEVF CP05 private AI TEST recovery tag only
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/devf-cp05-ai-pilot-tag.yml'
permissions:
  contents: write
jobs:
  seal-one-technical-tag:
    if: github.event.repository.private == true && github.head_ref == 'feature/devf-cp05-ai-bounded-pilot' && github.base_ref == 'feature/devf-cp04-4-eoc2-black-human-runtime-closure' && github.event.pull_request.base.sha == 'f7a6623f6d931bacef6f2c8e54f46f7476780ade' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Preserve all historical code and seal only the verified technical checkpoint
        shell: pwsh
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw 'Event SHA mismatch' }
          git merge-base --is-ancestor d0c633f3892f036c94ac47fbc82952521865dbbd HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Verified documentary closure missing' }
          git diff --exit-code ec61daa3ed7d539989028cd26b22fa529896de11 HEAD -- DEVF/CP05_AI_BOUNDED_PILOT/src DEVF/CP05_AI_BOUNDED_PILOT/tests DEVF/CP05_AI_BOUNDED_PILOT/CMakeLists.txt DEVF/CP05_AI_BOUNDED_PILOT/mod.json DEVF/CP05_AI_BOUNDED_PILOT/reused-cp03.json DEVF/CP05_AI_BOUNDED_PILOT/ci/audit.py DEVF/CP05_AI_BOUNDED_PILOT/ci/reviewed-imports.json DEVF/CP05_AI_BOUNDED_PILOT/ci/run_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Compiled graph changed' }
          $rows = @(git diff --name-status f7a6623f6d931bacef6f2c8e54f46f7476780ade HEAD)
          foreach ($row in $rows) {
            $part = $row -split "\t"
            if ($part.Count -ne 2 -or $part[0] -ne 'A' -or (-not $part[1].StartsWith('DEVF/CP05_AI_BOUNDED_PILOT/') -and $part[1] -ne '.github/workflows/devf-cp05-ai-pilot-tag.yml')) { throw 'Historical path modified or scope exceeded' }
            if ($part[1] -match '\.(arc|bmd|iso|exe|dll|dusk|zip)$') { throw 'Binary or original asset in source checkpoint' }
          }
          $root = 'DEVF/CP05_AI_BOUNDED_PILOT'
          $build = Get-Content "$root/evidence/build-result.json" -Raw | ConvertFrom-Json
          $download = Get-Content "$root/evidence/download-verification.json" -Raw | ConvertFrom-Json
          if ($build.status -ne 'BUILD_PASS_PACKAGE_VERIFIED_DOWNLOAD_PENDING' -or $build.offline_cases -ne 29 -or $download.status -ne 'DOWNLOAD_VERIFIED' -or $download.source_commit -ne 'ec61daa3ed7d539989028cd26b22fa529896de11' -or $download.manifest.package_sha256 -ne '23f81ad131082a03fcd66068ccd926ecf878182a5afce06244898cf663248ddb') { throw 'Verified results mismatch' }
          if ((git rev-parse DEVF_CP04_4_EOC2_BLACK_HUMAN_RUNTIME_OBSERVED_2026-10-14) -ne 'f21d0d95e0fc7d5fcbca15ae17ba6b50cdee564e') { throw 'Human tag object changed' }
          if ((git rev-parse 'DEVF_CP04_4_EOC2_BLACK_HUMAN_RUNTIME_OBSERVED_2026-10-14^{}') -ne 'f7a6623f6d931bacef6f2c8e54f46f7476780ade') { throw 'Human tag target changed' }
          if ((git rev-parse DEVF_CP04_4_EOC2_BLACK_PRIVATE_TEST_READY) -ne '21f9abb6b8dec176cc8b56d2652fb56a797ba45b') { throw 'CP04 TEST ref changed' }
          if ((git rev-parse DEVF_CP03_HP150_HUMAN_RUNTIME_VERIFIED_2026-10-14) -ne '08ffbae5e5da73658df77b3763de2fe6851f7a45') { throw 'CP03 ref changed' }
          $tagName = 'DEVF_CP05_AI_BOUNDED_PRIVATE_TEST_READY'
          $existing = @(git ls-remote --tags origin "refs/tags/$tagName")
          if ($LASTEXITCODE -ne 0 -or $existing.Count -ne 0) { throw 'Tag exists or cannot check; no overwrite permitted' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $tagName $env:TARGET_SHA -m 'CP05 bounded per-instance perception pilot; MSVC AMD64,29 offline cases,PE ABI/package and independent real download verified. HUMAN_RUNTIME_NOT_TESTED. CP04 historical package unchanged. No CP06.'
          if ($LASTEXITCODE -ne 0) { throw 'Annotated tag creation failed' }
          git push origin "refs/tags/$tagName"
          if ($LASTEXITCODE -ne 0) { throw 'Non-forced tag push failed' }
          $remote = @(git ls-remote --tags origin "refs/tags/$tagName" "refs/tags/$tagName^{}")
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 2 -or -not ($remote -match "^$($env:TARGET_SHA)\s")) { throw 'Annotated tag readback failed' }
          Write-Output "CP05_TECHNICAL_TAG_SEALED target=$env:TARGET_SHA"
