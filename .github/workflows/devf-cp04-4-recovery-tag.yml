name: DEVF CP04.4 source provenance and recovery
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/devf-cp04-4-recovery-tag.yml'
permissions:
  contents: read
jobs:
  verify-checkpoint:
    if: github.event.repository.private == true && github.head_ref == 'feature/devf-cp04-4-black-bokoblin' && github.base_ref == 'feature/devf-cp03-hp-diagnostic' && github.event.pull_request.base.sha == '139d9329f7a2d5d191b6e0ef7149ac9bbf82d29f' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify source provenance and all historical refs without compiling
        shell: pwsh
        env:
          CHECKPOINT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:CHECKPOINT_SHA) { throw 'Checkpoint mismatch' }
          python DEVF/CP04_4_BLACK_BOKOBLIN/tools/verify_checkpoint.py
          if ($LASTEXITCODE -ne 0) { throw 'CP04.4 source/recovery provenance failed' }
